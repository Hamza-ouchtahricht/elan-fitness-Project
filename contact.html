<body>

  <header class="en-tete">
    <div class="conteneur en-tete-contenu">
      <a href="#accueil" class="logo">Élan Fitness</a>

      <nav aria-label="Navigation principale">
        <ul class="menu">
          <li><a href="index.html">Accueil</a></li>

  <main>
    <section class="contact-container">

    <h2>Contacte Nous</h2>
    <form class="form-info">
      <div class="info-person">
      <label for="txt">Nom et Prénom</label><br>
      <input id="txt" type="text" placeholder="Entre votre nom et prénom" required>
      </div>
      <div class="email">
      <label for="email">Email</label><br>
      <input id="email" type="email" placeholder="Entre votre Email" required>
      </div>
      <div class="Message">
      <label for="Message">Message</label><br>
      <textarea id="Message"      name="Message" placeholder="Écrivez votre message ici..." required></textarea>   
      </div>
      <div class="submit">
      <input type="submit" value="Cliquez pour envoyer">
    </div>
    </form>
  </section>

  </main>

  
   <footer class="pied-de-page">
    <div class="conteneur">
      <div class="pied-haut">
        <div>
          <p class="logo logo-clair">Élan Fitness</p>
          <p class="slogan">Ton énergie, ton rythme.</p>
        </div>
